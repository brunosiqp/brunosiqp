<svg xmlns="http://www.w3.org/2000/svg" width="830" height="210" viewBox="0 0 830 210">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" />
      <stop offset="1" stop-color="#3fb950" />
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 38px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; }
    .role { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #58a6ff; }
    .place { font: 400 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #8b949e; }
    .chip { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #c9d1d9; }
    .node { fill: #0d1117; stroke-width: 2; }
  </style>

  <rect x="0.5" y="0.5" width="829" height="209" rx="12" fill="url(#bg)" stroke="#30363d" />
  <rect x="28" y="30" width="4" height="74" rx="2" fill="url(#accent)" />

  <text x="46" y="64" class="name">Bruno Siqueira</text>
  <text x="46" y="94" class="role">Senior IT Systems Analyst</text>
  <text x="46" y="118" class="place">Inventti · Blumenau, SC, Brazil</text>

  <g transform="translate(46 140)">
    <rect width="96" height="28" rx="14" fill="#161b22" stroke="#30363d" />
    <text x="48" y="18.5" text-anchor="middle" class="chip">Automation</text>
    <rect x="106" width="150" height="28" rx="14" fill="#161b22" stroke="#30363d" />
    <text x="181" y="18.5" text-anchor="middle" class="chip">Process Management</text>
    <rect x="266" width="100" height="28" rx="14" fill="#161b22" stroke="#30363d" />
    <text x="316" y="18.5" text-anchor="middle" class="chip">Dashboards</text>
    <rect x="376" width="92" height="28" rx="14" fill="#161b22" stroke="#30363d" />
    <text x="422" y="18.5" text-anchor="middle" class="chip">Data &amp; AI</text>
  </g>

  <!-- Decorative automation flow: sources feed a process that outputs to a dashboard. -->
  <g transform="translate(590 40)" fill="none" stroke-linecap="round">
    <path d="M14 20 C 60 20, 60 65, 104 65" stroke="#30363d" stroke-width="2" />
    <path d="M14 65 L 104 65" stroke="#30363d" stroke-width="2" />
    <path d="M14 110 C 60 110, 60 65, 104 65" stroke="#30363d" stroke-width="2" />
    <path d="M136 65 L 186 65" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 5" />
    <circle cx="14" cy="20" r="9" class="node" stroke="#58a6ff" />
    <circle cx="14" cy="65" r="9" class="node" stroke="#58a6ff" />
    <circle cx="14" cy="110" r="9" class="node" stroke="#58a6ff" />
    <rect x="104" y="49" width="32" height="32" rx="8" class="node" stroke="#3fb950" />
    <path d="M113 65 l5 5 l9 -10" stroke="#3fb950" stroke-width="2.5" />
    <rect x="186" y="37" width="40" height="56" rx="6" class="node" stroke="#58a6ff" />
    <rect x="194" y="71" width="6" height="14" rx="1" fill="#0e4429" />
    <rect x="203" y="62" width="6" height="23" rx="1" fill="#26a641" />
    <rect x="212" y="52" width="6" height="33" rx="1" fill="#39d353" />
  </g>
