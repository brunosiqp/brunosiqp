  <rect x="20" y="20" width="387" height="128" rx="10" fill="#161b22" stroke="#30363d" /><circle cx="52" cy="52" r="16" fill="#58a6ff" fill-opacity="0.12" /><path transform="translate(44 44)" fill="#58a6ff" d="M9.504.43a1.516 1.516 0 0 1 2.437 1.713L10.415 5.5h2.123c1.57 0 2.346 1.909 1.22 3.004l-7.34 7.142a1.249 1.249 0 0 1-.871.354h-.302a1.25 1.25 0 0 1-1.157-1.723L5.633 10.5H3.462c-1.57 0-2.346-1.909-1.22-3.004L9.503.429Zm1.047 1.074L3.286 8.571A.25.25 0 0 0 3.462 9H6.75a.75.75 0 0 1 .694 1.034l-1.713 4.188 6.982-6.793A.25.25 0 0 0 12.538 7H9.25a.75.75 0 0 1-.683-1.06l2.008-4.418.003-.006a.036.036 0 0 0-.004-.009l-.006-.006-.008-.001c-.003 0-.006.002-.009.004Z" /><text x="78" y="57" class="heading">Automation</text><text x="40" y="92" class="text">Python automations and Windows services that integrate REST</text><text x="40" y="111" class="text">APIs, web services and databases, processing large volumes of</text><text x="40" y="130" class="text">data with logging and error handling.</text><rect x="423" y="20" width="387" height="128" rx="10" fill="#161b22" stroke="#30363d" /><circle cx="455" cy="52" r="16" fill="#58a6ff" fill-opacity="0.12" /><path transform="translate(447 44)" fill="#58a6ff" d="M0 1.75C0 .784.784 0 1.75 0h3.5C6.216 0 7 .784 7 1.75v3.5A1.75 1.75 0 0 1 5.25 7H4v4a1 1 0 0 0 1 1h4v-1.25C9 9.784 9.784 9 10.75 9h3.5c.966 0 1.75.784 1.75 1.75v3.5A1.75 1.75 0 0 1 14.25 16h-3.5A1.75 1.75 0 0 1 9 14.25v-.75H5A2.5 2.5 0 0 1 2.5 11V7h-.75A1.75 1.75 0 0 1 0 5.25Zm1.75-.25a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h3.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25Zm9 9a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h3.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25Z" /><text x="481" y="57" class="heading">Processes &amp; administration</text><text x="443" y="92" class="text">I create, document and manage operational processes end to</text><text x="443" y="111" class="text">end, from mapping and implementation to monitoring and</text><text x="443" y="130" class