name: Update GitHub stats

on:
  schedule:
    - cron: "0 11,18 * * *"   # every day at 08:00 and 15:00 Brasília time (UTC-3)
  workflow_dispatch: {}       # allows running it manually from GitHub

permissions:
  contents: write

# Avoids two runs at the same time racing to push the SVG.
concurrency:
  group: update-github-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python github_stats.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "168676931+brunosiqp@users.noreply.github.com"
          git config --local user.name "brunosiqp"
          git add github-stats.svg
          git diff --quiet --cached || git commit -m "chore: update GitHub stats"
          git pull --rebase
          git push
